seam = "Chromium 156 blink::WEBPImageDecoder over its libwebp build, driven as Blink's Image decoder drives it for img, CSS and canvas images: WebPGetFeatures for alpha and codec format, WebPDemuxPartial for canvas size and frame count, kAlphaPremultiplied with ColorBehavior::kIgnore, SetData with all data received, IsSizeAvailable and FrameCount, then DecodeFrameBufferAtIndex(0) at natural size through a 64 MiB SkBitmap allocator cap. libwebp writes the first composited frame straight into ImageFrame's N32 buffer with MODE_BGRA or MODE_bgrA and its fixed-point premultiply (channel * alpha * 32897) >> 23"
streaming = "MGB1 request op 0 carries one complete WebP byte stream; there is no chunked SetData modeling and no partial-frame record. The response is status 0 when the header or the first frame fails (img.decode rejects and the canvas is transparent), otherwise status 1 with u32 natural width, natural height, alpha flag, frame count, frame width, frame height, N32 premultiplied BGRA byte count and those bytes"
reentrancy = "none: each request constructs one decoder, reads its size and frame synchronously and discards it; no client callback re-enters the decoder"
callbacks = "none: libwebp's incremental decoder and demuxer callbacks are internal to the seam and no client callback is observed"
threading = "One thread per process; Blink decodes on the calling thread"
wire_version = 1
corpus_sources = "Complete WebP bitstreams: stills and animations from the oracle tree's libwebp fuzzing seed corpus, Skia image resources, TFLite WebP test data, Blink testing data and WebGPU CTS resources; fresh images from the oracle tree's own libwebp encoder over deterministic seeded RGBA fields (lossy qualities 1 to 100 and lossless, opaque and varying alpha, sizes 1x1 to 65x64). Truncated, malformed and bit-flipped bitstreams are out of scope: libwebp accepts and partially or fully decodes some of them while the pure-Rust decoder rejects them, so they are not compared. Images over 256x256 and inputs over 128 KiB are excluded to bound golden size; the Skia invalid image skbug3429.webp is excluded for that decoder disagreement. The holdout uses other fixtures and a disjoint encoder seed range; fuzzing uses the same oracle encoder with fresh seeds and trailing-byte appends"
environment = "x86_64 Linux musl with AVX2: libwebp's SIMD VP8 reconstruction, VP8L decode and YUV-to-BGRA conversion, which equal their C paths for in-range data; ColorBehavior::kIgnore means an ICCP chunk never transforms pixels; alpha uses libwebp's fixed-point premultiply; default base::Feature states; frame buffers over 64 MiB fail allocation; natural-size decoding only"
comparison = "exact"
observable_surface = "img.decode success or failure, naturalWidth and naturalHeight after alpha and demux header parsing, the demux frame count, and the premultiplied BGRA pixels a canvas reads through getImageData at natural size for the first frame of a still or animation, including the transparent canvas of a failed decode. This is the surface F16 exposes for an image a page can draw and hash"
varying_relationships = "none: all recorded results are deterministic for the declared environment"
ordering = "One response per request; no streaming or cross-request state"
oracle_defects = "none: no known oracle defects"
improvements = "none: no required oracle improvements"
anchor = "make webp-anchor decodes corpus WebPs as data: URLs in the frozen x86_64 browser and compares img.decode failure, naturalWidth and naturalHeight with the harness for every case, and the getImageData pixels of an sRGB canvas drawn at natural size for opaque images: oracle-encoder lossy and lossless stills and tree fixtures. Alpha-bearing images are compared on decode status and size only, because the browser's color-managed readback rounds unpremultiplied channels by one from libwebp's premultiplied output. Malformed and truncated bitstreams, color-managed ICC images, animation timing, screenshots and arm64 are excluded"
arm64_evidence = "public_api: canvas getImageData in the frozen arm64 browser"
holdout_percent = 30
oracle = ".work/tmp/webp/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/webp"
fuzz = "driver"
fuzz_driver = "oracle/harness/webp/fuzz.py"
acceptance_cases = 20000
