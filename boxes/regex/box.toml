seam = "Chromium 156 V8 RegExp as observed through the JavaScript surface: new RegExp(pattern, flags | 'd') followed by repeated RegExp.prototype.exec calls, reading flags, index, the matched substring, capture-group substrings, m.indices (the d-flag hasIndices array) and lastIndex after each call; the source harness is V8 linked from the frozen source-oracle build and evaluated through the same engine.js that the frozen-browser anchor runs"
streaming = "One MGB1 request is version 1, a u16 length and UTF-8 pattern, a u16 length and ASCII flags, a u16 length and UTF-8 subject, a u16 iteration count 1..8 and a u16 initial lastIndex; the response is the engine's canonical UTF-8 record: E on a compile SyntaxError, otherwise O followed by the normalized re.flags and one record per call joined by '|', M with match start, end, UTF-16-code-unit hex of the match, semicolon-separated group records (U or start,end,hex) and lastIndex, or N with lastIndex on no match"
reentrancy = "none: each request runs one synchronous script on a fresh V8 context; repeated exec calls share one RegExp object only within the request"
callbacks = "none: the JS engine performs no host callbacks"
threading = "one thread per process; one V8 isolate per oracle process"
wire_version = 1
corpus_sources = "A deterministic pattern grammar over literals, dot, classes, ranges, JS decimal word and space classes and their negations, hex and unicode escapes, groups, alternation and greedy or lazy quantifiers, with subjects over ASCII and BMP text, flag subsets of g i m s u plus the d flag the engine adds, global lastIndex progression across up to four calls, fixed policy cases for dot with and without s, anchors with and without m, leftmost-first alternation and case folding, and clearly invalid patterns; fuzz mutates seen patterns, flags and subjects and draws fresh grammar cases"
environment = "x86_64 Linux, V8 from the frozen 156.0.8078.79 amd64 source-oracle build with its snapshot blob, external startup data and default isolate flags; subjects are well-formed Unicode with no lone surrogates, no carriage returns, U+2028 or U+2029, and no trailing line terminator; start lastIndex is always zero"
comparison = "exact"
observable_surface = "What page JS can observe from RegExp: normalized flags string, match index and end in UTF-16 code units, matched and captured substrings as UTF-16 code units, participation of each capture group, and lastIndex after exec with the d (hasIndices) flag; compile success versus SyntaxError only (V8 diagnostic text is not compared). Out of scope and absent from the corpus: sticky y, unicodeSets v, initial lastIndex other than zero, backreferences, lookaround, unicode property escapes, word-boundary assertions, octal and identity escapes, brace-form unicode escapes, line terminators other than LF, and case-folding equivalences outside the declared ASCII and BMP characters"
varying_relationships = "none: RegExp results are deterministic for the declared environment"
ordering = "exec calls and capture groups keep their JS order; response records keep call order"
oracle_defects = "none: no known oracle defects on the declared surface"
improvements = "none: no required oracle improvements"
anchor = "make regex-anchor runs fixed and generated ECMAScript RegExp cases in the frozen x86_64 browser through CDP Runtime.evaluate with the same engine.js as the source harness and compares flags, indices, captures and lastIndex for each case; color-managed and arm64 surfaces are excluded"
arm64_evidence = "public_api: RegExp exec and hasIndices in the frozen arm64 browser"
holdout_percent = 33
oracle = ".work/tmp/regex/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/regex"
fuzz = "driver"
fuzz_driver = "oracle/harness/regex/fuzz.py"
acceptance_cases = 20000
