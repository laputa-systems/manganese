seam = "Chromium 156 media::FFmpegDemuxer over a complete media::MemoryDataSource, the data: URL path of HTMLMediaElement: FFmpegGlue::OpenContext (avformat_open_input with the probe over FFmpeg 8's compiled demuxers, Chromium's demuxer and decoder whitelists, max_size 4096 and HLS detection on probe failure), avformat_find_stream_info with a 60 s analyze duration, FFmpegDemuxer::OnFindStreamInfoDone track selection and AudioDecoderConfig conversion, then FFmpegDemuxerStream::Read of every enabled stream to end of stream through EnqueuePacket"
streaming = "MGB1 request: one complete media file; response: text lines 'probe <FFmpeg demuxer name or none>', then for the FLAC and WAV demuxers and probe failures 'open <PipelineStatus>', and when open: 'duration', 'start', one 'stream' line per demuxer stream (liveness, enabled, AudioDecoderConfig codec, profile, sample format, channel layout, channels, rate, seek preroll, codec delay, encryption, discard flag and extra data hex), per enabled stream 'packets' with one line per DecoderBuffer (timestamp us, duration us or none, key flag, discard padding, size and SHA-256 of the payload) and 'end', then the final host duration, the buffered ranges and each OnDemuxerError status"
reentrancy = "none: one demuxer is initialized and read to end of stream per request"
callbacks = "DemuxerHost SetDuration, OnBufferedTimeRangesChanged and OnDemuxerError are recorded; MediaTracksUpdatedCB and the encrypted media callback are ignored"
threading = "FFmpegDemuxer's main sequence on the TaskEnvironment main thread with its blocking FFmpeg sequence on the thread pool; the candidate runs one thread"
wire_version = 1
corpus_sources = "Generated RIFF, RIFX, RF64 and BW64 WAV files across PCM widths, float, A-law, mu-law, WAVEFORMATEXTENSIBLE masks and subformat GUIDs, unsupported and unknown format tags, fmt sizes, chunk layouts (LIST, fact, bext, cue, id3, SMV0, junk, padding, ID3v2 prefixes), header field extremes, truncations at header offsets and seeded byte mutations; WAV, FLAC and MP3 files from the oracle source tree (ChromeOS, WebRTC, input tools, Blink HRTF and intro sounds); generated FLAC files across channel counts and decorrelation modes, sample sizes, sample-rate and block-size codes, fixed and variable block sizes, frame counts around the parser's ten-header window, STREAMINFO field extremes and mismatches, metadata blocks (padding, application, seektable, Vorbis comments with WAVEFORMATEXTENSIBLE_CHANNEL_MASK values, cuesheets, pictures including the truncated-size workaround, reserved and invalid types), raw frames without the fLaC marker, junk, bad CRCs, frame-number gaps, reordered and duplicated frames, ID3v2 prefixes, truncations and seeded byte mutations; FLAC files from the oracle source tree (ChromeOS power and focus sounds, intro sounds, Blink HRTF); generated Ogg files with Opus and Vorbis headers, comments, chained streams, CRC and version mutations, granule extremes, EOS and truncation variants, trailing junk and seeded byte mutations, and Vorbis files from the oracle source tree; probe-only inputs (HLS playlists, EBML and ftyp headers, MPEG audio and ADTS frames, ID3 tags, text, zeros and random bytes); fuzzing mutates seen inputs byte-wise"
environment = "x86_64 Linux musl; Chromium 156 media over FFmpeg 8 with Chrome branding (aac, flac, matroska, mov, mp3, ogg and wav demuxers; aac, flac, mp3, vorbis, libopus and PCM decoders); no MediaClient, so default decoder support; default base::Feature states; is_local_file false"
comparison = "exact"
observable_surface = "For inputs FFmpeg probes as FLAC, MP3, Ogg, WAV or as no format: the PipelineStatus a page reads as MediaError, HTMLMediaElement duration at metadata and after end of stream, the start time, the audio track configuration (codec, sample format, layout, channels, rate, extra data), every demuxed buffer's timestamp, duration, key flag, discard padding and payload bytes up to end of stream, the demuxer's buffered ranges and its playback errors; for inputs probed as AAC/ADTS, Matroska/WebM or MP4 only the selected demuxer is compared, their demux being follow-up scope; WAV fmt tags whose payload FFmpeg hands to a codec parser (MPEG audio, AAC, FLAC) are outside the record domain"
varying_relationships = "none: demuxing a complete in-memory source is deterministic"
ordering = "Buffers in demux order per stream; streams in FFmpegDemuxer::GetAllStreams order with enabled streams first; OnDemuxerError statuses in arrival order"
