seam = "Chromium 156 media::FFmpegDemuxer over a complete media::MemoryDataSource, the data: URL path of HTMLMediaElement: FFmpegGlue::OpenContext (avformat_open_input with the probe over FFmpeg 7's compiled demuxers, Chromium's demuxer and decoder whitelists, max_size 4096 and HLS detection on probe failure), avformat_find_stream_info with a 60 s analyze duration, FFmpegDemuxer::OnFindStreamInfoDone track selection and AudioDecoderConfig conversion, then FFmpegDemuxerStream::Read of every enabled stream to end of stream through EnqueuePacket"
streaming = "MGB1 request: one complete media file; response: text lines 'probe <FFmpeg demuxer name or none>', then for the WAV demuxer and probe failures 'open <PipelineStatus>', and when open: 'duration', 'start', one 'stream' line per demuxer stream (liveness, enabled, AudioDecoderConfig codec, profile, sample format, channel layout, channels, rate, seek preroll, codec delay, encryption, discard flag and extra data hex), per enabled stream 'packets' with one line per DecoderBuffer (timestamp us, duration us or none, key flag, discard padding, size and SHA-256 of the payload) and 'end', then the final host duration, the buffered ranges and each OnDemuxerError status"
reentrancy = "none: one demuxer is initialized and read to end of stream per request"
callbacks = "DemuxerHost SetDuration, OnBufferedTimeRangesChanged and OnDemuxerError are recorded; MediaTracksUpdatedCB and the encrypted media callback are ignored"
threading = "FFmpegDemuxer's main sequence on the TaskEnvironment main thread with its blocking FFmpeg sequence on the thread pool; the candidate runs one thread"
wire_version = 1
corpus_sources = "Generated RIFF, RIFX, RF64 and BW64 WAV files across PCM widths, float, A-law, mu-law, WAVEFORMATEXTENSIBLE masks and subformat GUIDs, unsupported and unknown format tags, fmt sizes, chunk layouts (LIST, fact, bext, cue, id3, SMV0, junk, padding, ID3v2 prefixes), header field extremes, truncations at header offsets and seeded byte mutations; WAV, FLAC and MP3 files from the oracle source tree (ChromeOS, WebRTC, input tools, Blink HRTF and intro sounds); probe-only inputs (HLS playlists, Ogg, FLAC, EBML and ftyp headers, MPEG audio and ADTS frames, ID3 tags, text, zeros and random bytes); fuzzing mutates seen inputs byte-wise"
environment = "x86_64 Linux musl; Chromium 156 media over FFmpeg 7 with Chrome branding (aac, flac, matroska, mov, mp3, ogg and wav demuxers; aac, flac, mp3, vorbis, libopus and PCM decoders); no MediaClient, so default decoder support; default base::Feature states; is_local_file false"
comparison = "exact"
observable_surface = "For inputs FFmpeg probes as WAV or as no format: the PipelineStatus a page reads as MediaError, HTMLMediaElement duration at metadata and after end of stream, the start time, the audio track configuration (codec, sample format, layout, channels, rate, extra data), every demuxed buffer's timestamp, duration, key flag, discard padding and payload bytes up to end of stream, the demuxer's buffered ranges and its playback errors; for inputs probed as FLAC, MP3, AAC/ADTS, Ogg, Matroska/WebM or MP4 only the selected demuxer is compared, their demux being follow-up scope; WAV fmt tags whose payload FFmpeg hands to a codec parser (MPEG audio, AAC, FLAC) are outside the record domain"
varying_relationships = "none: demuxing a complete in-memory source is deterministic"
ordering = "Buffers in demux order per stream; streams in FFmpegDemuxer::GetAllStreams order with enabled streams first; OnDemuxerError statuses in arrival order"
oracle_defects = "none: no known oracle defects"
improvements = "none: no required oracle improvements"
anchor = "make media-demux-anchor plays WAV and unrecognized corpus files as audio/wav data: URLs in the frozen x86_64 browser and compares MediaError code and PipelineStatus, HTMLMediaElement duration at loadedmetadata and after playback ends, and the playback error of demuxer errors with the source harness; packet payloads, buffered ranges and probe-only formats have no browser surface in this check"
arm64_evidence = "public_api: HTMLMediaElement duration and MediaError of the frozen arm64 browser"
holdout_percent = 30
oracle = ".work/tmp/media-demux/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/media-demux"
