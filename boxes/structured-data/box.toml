seam = "Chromium 156 native structured data: base::JSONReader (its Rust serde_json_lenient 0.2.4 core) and base::JSONWriter for base::Value documents, and third_party/libxml2 2.13 parse plus xmlDocDumpMemory serialization for XML documents; the Manganese adapter carries Chromium's JSON leniency bits, Value number typing, JSON string escaping and XML serialization policy over serde_json_lenient and quick-xml"
streaming = "MGB1 request op 1 carries one options byte and a u32-length UTF-8 JSON document; op 2 carries one options byte and a canonical Value; op 3 carries u32 libxml2 options and a u32-length XML document. A JSON parse response is one success byte then a canonical Value (tag, i32, f64 bits, u32-length UTF-8 string, u32-count list or sorted dict), or a failure byte, i32 line, i32 column and u32-length error message. A JSON write response is a success byte and u32-length JSON bytes. An XML parse response is one success byte, a u32 event count, events (element start with attributes and namespace declarations, element end, text, comment, PI, CDATA) and u32-length serialized XML bytes, or a single failure byte; XML error detail is not compared."
reentrancy = "none: every request owns its document and finishes synchronously"
callbacks = "none: parsing and serialization return their output synchronously"
threading = "one thread per process and request"
wire_version = 1
corpus_sources = "Deterministic JSON syntax and structural cases (literals, number classes, strings and escapes, surrogate pairs, duplicate keys, nesting and depth, BOM, whitespace, all six Chromium leniency bits, malformed inputs), canonical Value serialization cases, XML structural cases (elements, attributes, default and prefixed namespaces, predefined and numeric entities, comments, CDATA, PI, empty elements, whitespace, malformed documents) and seeded random cases in both lanes; a shared fuzz driver mutates the same grammar for 20000 cases. JSON scalar number classification and double formatting are also compared by the numerics box, which this box reuses for the JSON writer; XML DOM, SVG and XSLT behavior belongs to F11 and is not claimed here."
environment = "x86_64 Linux musl; the source harness links the frozen oracle tree's base JSON objects, the vendored serde_json_lenient 0.2.4 wrapper with float_roundtrip and unbounded_depth, and its third_party/libxml2 objects with LIBXML_STATIC; libxml2 options are restricted to 0 in this box; default base::Feature states"
comparison = "exact"
observable_surface = "The Value a base::JSONReader caller reads and the exact JSON bytes a base::JSONWriter caller emits (DevTools /json endpoints, Preferences and extension resources read these), and the DOM structure plus serialized XML bytes libxml2 callers read from a parsed document. The frozen-browser anchor compares only the strict JSON round-trip and XML serialization subset a page can read through JSON.parse/JSON.stringify and DOMParser/XMLSerializer."
varying_relationships = "none: results are deterministic for the declared options and environment"
ordering = "Dictionary keys are sorted by base::flat_map and BTreeMap, XML events and serialized bytes follow document order"
oracle_defects = "none: no known oracle defects in the compared surface"
improvements = "none: no required oracle improvements"
anchor = "make structured-data-anchor strict JSON round-trip and XML serialization in the frozen browser"
arm64_evidence = "public_api: JSON.parse/JSON.stringify and DOMParser/XMLSerializer in the frozen arm64 browser"
holdout_percent = 48
oracle = ".work/tmp/structured-data/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/structured-data"
fuzz = "driver"
fuzz_driver = "oracle/harness/structured-data/fuzz.py"
acceptance_cases = 20000
