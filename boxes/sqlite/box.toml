seam = "Chromium sql::Database, sql::Statement, sql::Transaction and sql::MetaTable over the SQLite amalgamation with Chromium's configuration (exclusive locking, TRUNCATE rollback journal or WAL, secure_delete, ICU, SQLITE_DQS=0, upsert, window, JSON, EXPLAIN and ANALYZE omitted); callers are History, Favicons, Top Sites, Shortcuts, Web Data, Login Data, Cookies, Trust Tokens, Network Action Predictor, QuotaManager, DIPS, ServerCertificate, Shared Dictionary, Affiliation, heavy ad intervention, declarative performance observer, segmentation UKM and the GPU persistent cache"
