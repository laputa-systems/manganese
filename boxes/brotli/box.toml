seam = "Chromium Brotli decoder callers linked into chrome: net BrotliSourceStream for Content-Encoding br and dcb raw dictionaries, WOFF2 (libots through woff2_dec) and TLS certificate decompression as one-shot decodes with an exact length check, resource bundle one-shot decoding, the update client's puffin patch decode loop, and the incremental font transfer shared Brotli patch decoder. Not callers: Blink CompressionStream and DecompressionStream have no Brotli format, FreeType's WOFF2 loader is not compiled, and puffin's BrotliEncode is built but called only by the unlinked puffin diff library"
streaming = "MGB1 records carry mode, u16 chunk count, u32 output size, u32 dictionary size, dictionary bytes, then u32 length and bytes per chunk. Mode 0 replays net FilterSourceStream: chunks are upstream reads of 1 to 32768 bytes, the output size is the consumer read size, each Read drives BrotliDecoderDecompressStream until it yields no bytes, a decoder error discards that call's output, success discards trailing input and truncated input ends silently at upstream EOF; the response is the mode byte, i32 produced and bytes per read, then i32 0 or -330. Modes 1 and 2 are single BrotliDecoderDecompress calls (WOFF2 and TLS require the exact decoded size, resource bundle requires only success); the response is the mode byte, i32 success and on success the whole output buffer. Mode 3 replays puffin's 32768-byte output loop and answers i32 1 and the patch bytes, 0 for failure or -1 where puffin would loop forever. Modes 4 and 5 replay the shared Brotli patch decoder without and with a raw dictionary and answer i32 0 and the bytes or an error code 1 to 4"
reentrancy = "none: each request executes synchronously"
callbacks = "none: decoder allocations use the default allocators"
threading = "One thread per stream and process"
wire_version = 1
corpus_sources = "Streams from the oracle's own Chromium Brotli encoder (qualities 0 to 11, lgwin 10 to 30 with large window, generic, text and font modes, prepared raw dictionaries) over deterministic text, markup, stylesheet, table, random, repeated, zero and repository documents, with different documents in seen and holdout; truncated, trailing, corrupted, large-window, wrong-dictionary, missing-dictionary and wrong-size cases; fuzz mutates seen records and replays their streams through every caller"
environment = "x86_64 Linux musl; Chromium third_party/brotli decoder sources compiled with the chrome target flags; no decoder parameters set, so large-window streams are rejected as in chrome"
comparison = "exact"
observable_surface = "HTTP response body reads, truncation and decoding errors, dcb bodies, WOFF2 and TLS certificate bytes and rejection, resource buffer bytes, update patch bytes, rejection or nontermination, and font patch bytes or error kind"
varying_relationships = "none: all recorded results are deterministic for the declared environment"
ordering = "Input chunks, decoder calls and output bytes retain their order"
oracle_defects = "none: no known oracle defects"
improvements = "none: no required oracle improvements"
anchor = "make brotli-anchor serves 43 reference-encoder streams with Content-Encoding br to the frozen x86_64 browser and compares each fetched body or rejection with the source oracle harness"
arm64_evidence = "public_api: Content-Encoding br response bodies fetched in the frozen arm64 browser"
