seam = "Chromium net HTTP/2 client session over one fresh scripted TLS-like socket per record: SpdySessionPool::CreateAvailableSessionFromSocket with ALPN h2, SpdySession::SendInitialData's connection preface, initial SETTINGS frame and connection WINDOW_UPDATE, SpdyStreamRequest::StartRequest and SpdyStream::SendRequestHeaders with request priorities and quiche's HpackEncoder (Huffman, static and dynamic table indexing, cookie crumbling), the client's SETTINGS ACK, and client RST_STREAM on connection reset"
streaming = "MGB1 records: version 1, u8 count of 1 to 8 requests, each with u16-length method, scheme, host and path, u16 count of name and value pairs, u8 request priority (0 throttled to 5 highest), u16 response status, u8 server reset flag and optional u32 error code, and u8 trailer flag; then u16 count of server SETTINGS id and value pairs, u32 connection WINDOW_UPDATE delta, u8 socket end (0 close, 1 reset) and a u32-length blob of raw server HTTP/2 frames; the response lists the hex of all client-written bytes and one headers, optional trailers and close line per stream"
reentrancy = "none: one session runs to completion per record"
callbacks = "none: SpdyStream delegates are driven by one task environment until idle"
threading = "One IO thread with mock time; the scripted socket reads server frames synchronously and records every client write"
wire_version = 1
corpus_sources = "Systematic cases over methods, schemes, hosts and paths, six caller header sets including duplicated and crumbled cookies, all six request priorities, response statuses, server SETTINGS variants, connection window updates, trailers and server resets, plus seeded random cases; the corpus currently holds one request per session and does not claim multiplexed streams or server push"
environment = "x86_64 Linux musl; the frozen Chromium 156 net HTTP/2 session policy with no SETTINGS grease, no priority updates, no ping-based checking, kSpdyMaxHeaderTableSize and kMaxDecodeSpdyHeaders; TLS is modeled by a scripted socket reporting TLS 1.3 with an allowed cipher, so ALPN and certificate trust are compared only by the anchor through the shared HTTPS fixture"
comparison = "exact"
observable_surface = "The exact bytes a server reads from the client connection: connection preface, initial SETTINGS values and order, connection WINDOW_UPDATE, HEADERS flags and priority payload, HPACK indexing and Huffman choices, SETTINGS ACK and RST_STREAM error codes; plus the stream status code, trailers and close result a page or CDP observes. The source harness compares these bytes at the SpdySession seam; the anchor compares the fixture-observed browser profile at the same frame level"
varying_relationships = "none: the harness and candidate script the same server frames and use the same task environment"
ordering = "Preface before SETTINGS before WINDOW_UPDATE; HEADERS in stream order; SETTINGS ACK after client HEADERS; RST_STREAM after the ACK"
oracle_defects = "none: no known oracle defects"
improvements = "none: no required oracle improvements"
anchor = "make http2-anchor compares the frozen browser's HTTP/2 client frame profile through the shared HTTPS fixture with the source harness and candidate"
arm64_evidence = "captures: none produced; an arm64 Linux host must capture the frozen browser's HTTP/2 wire profile through the shared HTTPS fixture and compare it with the source harness"
holdout_percent = 30
oracle = ".work/tmp/http2/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/http2"
fuzz = "driver"
fuzz_driver = "oracle/harness/http2/fuzz.py"
acceptance_cases = 20000
