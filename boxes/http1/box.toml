seam = "Chromium net HTTP/1.1 client transaction over one fresh SOCKS5 connection per attempt: URLRequestHttpJob::Start's default headers (Referer, User-Agent if missing, Accept-Encoding, Accept-Language, Cookie) applied through HttpRequestHeaders in its order, HttpNetworkTransaction::BuildRequestHeaders, HttpBasicStream request line and HttpStreamParser writes; HttpStreamParser reads, HttpResponseHeaders parsing and HttpChunkedDecoder; HttpNetworkTransaction's header loop (103 and 1xx, Content-Encoding validation, HTTP/0.9 PUT, one 421 retry on a new connection, 407 without an HTTP proxy) and body reads; socket disposal by the transaction destructor, HttpResponseBodyDrainer and the pool's idle check"
streaming = "MGB1 records: version 1, u16-length URL, u16-length method, load flags (0 none, 1 bypass cache, 2 validate cache), body kind (0 none, 1 u32-length bytes, 2 u16 count of non-empty u32-length chunks appended to a ChunkedUploadDataStream), u16 count of caller header name and value pairs, u16-length referrer, user agent, Accept-Language and cookie line, u16 count of u32-length server segments of 1 to 16384 bytes each delivered as one socket read, and the server's end (0 close, 1 reset, 2 hang); the response lists the bytes sent on each connection, the transaction start result, the response version, code, status line and header lines, the body read in 32 KiB reads, the body end result and whether the socket returned idle to the pool"
reentrancy = "none: one transaction runs to completion or stall per record"
callbacks = "none: completion callbacks are driven by one task environment until idle"
threading = "One main IO thread with a queued thread pool under mock time"
wire_version = 1
corpus_sources = "Generated conformance cases for every canonical URL form in the pool, methods, load flags, in-memory and chunked uploads around the 1400-byte merge and 16372-byte chunk boundaries, caller header sets copied from the frozen persona wire captures and odd caller headers (case, duplicates, control and high bytes, overrides of net-owned headers, Range); status lines, codes, Content-Length, Transfer-Encoding and Content-Encoding variants, response header and malformed line shapes, chunked encodings, close, reset and hang endings, informational chains, 421, 401, 407, HTTP/0.9 and Shoutcast, header-size limits, NUL bytes and line-ending variants, plus seeded random cases; fuzzing mutates generated responses byte-wise and re-segments them"
environment = "x86_64 Linux musl; Chromium 156 net with default features (kTruncateBodyToContentLength enabled), brotli and zstd enabled, no HTTP cache, a fixed socks5://127.0.0.1:1080 proxy with <-loopback> as the appliance launches it; https is outside the record domain because trusted TLS is unavailable to the source harness and the anchor"
comparison = "exact"
observable_surface = "Request bytes a server receives on each connection (request line, header order, case and values, body framing), the net error a page or CDP reports, the response status code, status line, header lines and body bytes CDP and fetch expose, and whether the server sees the connection kept for reuse; record inputs are GURL-canonical URLs and referrers and header names and values Chromium accepts"
varying_relationships = "none: the harness and candidate read the same scripted segments deterministically"
ordering = "Header order on the wire; connection order for the 421 retry; body bytes in read order"
oracle_defects = "none: no known oracle defects"
improvements = "none: no required oracle improvements"
anchor = "make http1-anchor compares the frozen browser's requests captured at the appliance SOCKS5 egress and its CDP response views with the source harness"
arm64_evidence = "public_api: CDP Network views and SOCKS5 egress captures of the frozen arm64 browser"
holdout_percent = 30
oracle = ".work/tmp/http1/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/http1"
fuzz = "driver"
fuzz_driver = "oracle/harness/http1/fuzz.py"
acceptance_cases = 20000
