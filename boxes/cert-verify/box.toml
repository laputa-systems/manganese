seam = "Chromium net::CertVerifyProc::Verify over CertVerifyProcBuiltin as the Linux network service builds it: X509Certificate creation from the server's Certificate message, BoringSSL pki ParsedCertificate parsing, CertPathBuilder with the InstanceParams trust store, the compiled Chrome Root Store and the presented intermediates, VerifyCertificateChain, the PathBuilderDelegateImpl checks (additional anchor name constraints, Chrome Root Store constraints, CRLSet SPKI block list, CT policy and requirement), AssignVerifyResult's error mapping, and Verify's post-checks (signature algorithm inspection, hostname match, known interception, legacy name-constrained roots, weak keys, validity period and non-unique names for known roots)"
streaming = "MGB1 records: version 1, i64 verification time in Unix seconds (years 1 to 9999), u16-length hostname as SSLClientSocket passes it, u16 count of u32-length DER certificates in Certificate message order (target first), u16 count of trust entries each with u8 kind (0 CACertificates anchor, 1 anchor with enforced constraints, 2 CACertificatesWithConstraints anchor, 3 trusted leaf, 4 trusted anchor or leaf, 5 CAHintCertificates untrusted authority, 6 CADistrustedCertificates SPKI), u32-length DER and, for kinds 2 to 4, u16 count of u16-length permitted DNS names and u16 count of CIDRs as u8 width 4 or 16, address and mask; then an optional u16-length TLS signed-certificate-timestamp list and u16-length stapled OCSP response; the response is the lines error <net error> <name>, status <CertStatus flags>, ct <CT policy compliance> and chain <SHA-256 of each verified certificate>, or only the error line when X509Certificate rejects the target"
reentrancy = "none: each record runs one verification to completion"
callbacks = "none: no CertNetFetcher is installed, so path building and revocation never call out"
threading = "One thread per process; each record builds a fresh CertVerifyProcBuiltin"
wire_version = 1
corpus_sources = "Generated chains assembled as DER with every key and signature from the oracle builder image's openssl (test keys checked in under oracle/harness/cert-verify/keys): hostname matching (exact, wildcard, registry-controlled and private suffixes, IPv4, IPv6 and mapped SANs, trailing dots, NUL and empty names, CN-only), validity at and around boundaries and in every time encoding, all seven trust kinds and their duplicates, distrusted SPKIs, cross-signs, rollover roots, key-identifier and validity prioritization, the 20-iteration path builder limit, loops and depth, basic constraints, path length, key usage, EKU, unknown critical extensions, CT poison and MS application policies, name constraints of every form, certificate policies, mappings and constraints, signature algorithms (SHA-1, MD5, PKCS#1, PSS, ECDSA, Ed25519, mismatched and alternate encodings) and key sizes and curves, names in every string type, serial and version edge cases, each Chrome Root Store root as a target at timely, stale, early and pre-constraint times, the in-tree BoringSSL verify_certificate_chain_unittest SERVER_AUTH cases and path_builder_unittest data, every net/data/ssl/certificates PEM against Chromium's test root, a captured public-root chain with real embedded SCTs from known logs at a timely and a stale verification time with altered signatures, reduced qualifying SCTs, a hostname mismatch and a handshake SCT list, and fuzzing mutates seen records structurally and certificates byte-wise"
environment = "x86_64 Linux musl; Chromium 156.0.8078.79 with the compiled-in Chrome Root Store version 40 (the appliance passes --disable-component-update), CRLSet::BuiltinCRLSet, the static CT log list (timestamp 2026-10-05) with ChromeCTPolicyEnforcer and ChromeRequireCTDelegate and CT enforcement on (the oracle tree enables kCertificateTransparencyAskBeforeEnabling by default), verify flags 0, no CertNetFetcher (no AIA fetching or online revocation), no network time, an empty NSS user database, default features (kVerifyQWACs, kVerifyMTCs, kSelfSignedLocalNetworkInterstitial and kEnforceOneRfc6962CtPolicy off), this build's empty EV metadata, stapled OCSP and TLS SCT lists only when the record carries them, Time::Now pinned to the record time; hostnames are GURL-canonical hosts (IPv6 without brackets); chains in which an ML-DSA key must verify a signature are outside the record domain"
comparison = "exact"
observable_surface = "Per presented chain, hostname, verification time and InstanceParams trust configuration: the net error a navigation, fetch or CDP Network.loadingFailed reports (ERR_CERT_* or ERR_SSL_SERVER_CERT_BAD_FORMAT), the CertStatus bits behind the certificate interstitial and CDP Security.visibleSecurityState, the CT policy compliance CDP SecurityDetails.certificateTransparencyCompliance reports, and the verified chain CDP Network.getCertificate returns, compared by SHA-256 of each certificate's DER; CT enforcement is exercised through Chrome Root Store roots presented as targets and through a public-root chain with real SCTs from logs in the frozen static log list, and revocation only through the CRLSet SPKI block list"
varying_relationships = "none: verification is deterministic for a fixed time and trust configuration"
ordering = "Verified chain order from target to trust anchor; trust entries apply in InstanceParams order"
oracle_defects = "none: no known oracle defects"
improvements = "none: no required oracle improvements"
anchor = "make cert-verify-anchor serves 21 chains generated at run time over TLS through the appliance SOCKS5 egress to the frozen x86_64 browser, with trust from the CACertificates, CACertificatesWithConstraints, CAHintCertificates and CADistrustedCertificates enterprise policies (no ignore-certificate-errors), and compares each navigation's net error, CDP certificateTransparencyCompliance and Network.getCertificate chain with the source harness at the navigation time; Chrome Root Store chains are outside the anchor because no publicly trusted key is available"
arm64_evidence = "public_api: navigation net errors and CDP security details of the frozen arm64 browser for the anchor's chains"
holdout_percent = 30
oracle = ".work/tmp/cert-verify/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/cert-verify"
fuzz = "driver"
fuzz_driver = "oracle/harness/cert-verify/fuzz.py"
acceptance_cases = 10000
