seam = "Chromium 156 zip::ZipReader over a complete in-memory archive: third_party/zlib/google/zip_reader.cc opens an in-memory string through minizip's unzOpen2, unzGetCurrentFileInfo64 reads each central-directory entry and applies Chromium's path conversion and Normalize (ROOT/DOT/UP and Windows-invalid character replacement), and ExtractCurrentEntryToString reads a file's payload through minizip's stored, raw-DEFLATE and bzip2-method paths with CRC checking. This is the reader CRX install, component unzip and archive analysis share in the source tree; no page-facing ZIP API exists in this browser, so the frozen-browser anchor covers only the DEFLATE payload a page can decode itself"
streaming = "MGB1 request op 1 carries one complete ZIP archive; the response is text lines: 'open 0' on open failure or 'open 1', one 'entry <index>' group with 'path', 'raw', 'physical' (hex-encoded UTF-8), 'size', 'time' (Chromium base::Time internal microseconds), 'dir', 'unsafe', 'encrypted', 'aes', 'mode', 'symlink' and 'payload <ok|fail|none> <length> <hex SHA-256>', then 'ok 0|1'"
reentrancy = "none: one reader is opened, enumerated and extracted to completion per request"
callbacks = "none: ZipReader's WriterDelegate writes to an in-memory string; no host callback or progress listener is installed"
threading = "One synchronous archive read on the calling thread in each adapter"
wire_version = 1
corpus_sources = "Generated ZIPs from a byte-level builder: stored and raw-DEFLATE entries at 0 to 65536 bytes with flat, text, sequence and random payloads; one to twenty entries, relative and nested names, leading slash, dot and dot-dot components, backslashes, colons, non-ASCII UTF-8 and invalid UTF-8 names, 255-byte names, duplicate names and directory entries; UTF-8 and CP437 flags, data descriptors with and without a signature in 32- and 64-bit forms, zip64 EOCD plus size and offset extra fields, Info-ZIP Unicode Path extra fields with a matching CRC, DOS timestamps at valid and invalid extremes, Unix and DOS creator systems, POSIX modes and symlink bits, ZipCrypto and AES flags, bzip2 and unsupported methods, archive comments, SFX prefixes, trailing junk, CRC and size corruption, truncated archives, bad local signatures, local/central name mismatch, bad central-directory offsets and inflated entry counts; seeded generated archives with varied fields and payload bytes in both lanes; differential fuzz generates the same structured archive space for 20000 cases per run"
environment = "x86_64 Linux musl in the digest-pinned oracle builder image; the harness sets the C.UTF-8 locale so multi-byte path conversion is defined; minizip's CRC and zlib inflate use the oracle tree's third_party/zlib, with the same decoder behavior as the browser's CompressionStream/DecompressionStream; default base::Feature states; no password is configured, so encrypted entries are classified but their payloads are not decrypted; paths between the central directory and EOCD must be well formed (embedded false EOCD signatures are out of scope)"
comparison = "exact"
observable_surface = "At the source-harness seam: every central-directory entry's normalized and physical path, safety and encryption flags, size, timestamp, POSIX mode and symlink bit, each payload's length, digest and extraction status, and the reader's final ok status. At the frozen-browser surface: only the bytes a page obtains by applying DecompressionStream('deflate-raw') to a deflate entry's compressed bytes; ZIP structure, path normalization, timestamps, encryption and data-descriptor decisions have no page-visible surface in this browser and are not claimed at that level"
varying_relationships = "none: all recorded results are deterministic for the declared environment and locale"
ordering = "Entries appear in central-directory order and payloads in entry order"
oracle_defects = "none: no known oracle defects; open failure on nonconforming intervening EOCD records and on arbitrary structural byte mutation is outside the record domain and is not excused in the comparator"
improvements = "none: no required oracle improvement"
anchor = "make zip-anchor compares 45 raw-DEFLATE ZIP entry payloads (sizes 0, 1, 17, 64 and 4096; flat, sequence and random bytes; compression levels 1, 6 and 9) between the source harness and DecompressionStream('deflate-raw') in the frozen x86_64 browser; ZIP structure has no browser surface in this check, and arm64 and encrypted payloads are excluded"
arm64_evidence = "public_api: DecompressionStream('deflate-raw') of ZIP entry payload bytes in the frozen arm64 browser"
holdout_percent = 30
oracle = ".work/tmp/zip/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/zip"
fuzz = "driver"
fuzz_driver = "oracle/harness/zip/fuzz.py"
acceptance_cases = 20000
