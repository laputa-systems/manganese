seam = "Chromium net SSLClientSocketImpl::Init's TLS ClientHello generation for the appliance's fixed network-service policy: the SSL_CTX grease, session-cache and certificate-compression setup, SSL_set_tlsext_host_name, SSL_set1_group_ids and SSL_set1_client_key_shares, SSL_set_min_proto_version and SSL_set_max_proto_version, SSL_set_strict_cipher_list, SSL_set_verify_algorithm_prefs, SSL_set_alpn_protos, signed-certificate-timestamps and OCSP stapling, ECH GREASE, permutation and the initial ClientHello serialization. The source harness captures the outgoing handshake message through SSL_CTX_set_msg_callback, the same hook Chromium installs."
streaming = "MGB1 records: version 1, u16-length ASCII SNI host (1 to 253 bytes), u8 ALPN protocol count (1 to 8), each protocol u8-length (1 to 32) bytes. The response is version 1 followed by the cipher list in wire order with GREASE codes normalized, the compression methods, and the extension multiset sorted by normalized type and body; each extension keeps its type and exact body except that RNG-drawn bytes are normalized: client random, session id, GREASE codes, key-share keys, and the ECH GREASE blob."
reentrancy = "none: one ClientHello is generated per record"
callbacks = "none: the source harness hands the captured message to its own serializer; no network or certificate callback runs"
threading = "One thread per process; each record builds a fresh SSL_CTX and SSL"
wire_version = 1
corpus_sources = "Systematic hosts (fixture host, short and 253-byte names, hyphens, subdomains, uppercase) crossed with h2+http/1.1, http/1.1 and h2 ALPN lists, protocol-count and host-length and protocol-length boundaries, plus 120 seeded random valid host and ALPN records; fuzzing mutates seen records' hosts with DNS-safe bytes and resamples the declared ALPN list."
environment = "x86_64 Linux musl; the frozen Chromium 156 network policy: TLS 1.2 minimum and TLS 1.3 maximum, cipher list ALL:!aPSK:!ECDSA+SHA1:!3DES, groups X25519MLKEM768, X25519, P-256 and P-384 with key shares for the first two, Chromium's ML-DSA/ECDSA/RSA verification preferences, session tickets, status request, SCT and OCSP requests, certificate compression and GREASE with extension permutation. The source harness models this policy directly with BoringSSL calls; it does not model the browser's ALPS or trust-anchor-ID extensions or its GREASE key-share padding, and those are outside the source-harness comparison."
comparison = "exact"
observable_surface = "The cipher suite list and its order, compression methods, extension type set, and each modeled extension's exact body: SNI, ALPN, signature algorithms, supported groups, supported versions, key-share group list, PSK modes, session ticket, status request, SCT, OCSP, extended master secret, certificate compression and GREASE structure. These are the fields a TLS server can read from the wire. The frozen-browser anchor compares the subset of this surface the source harness models; ALPS, trust-anchor-ID extensions, GREASE key-share padding, hello retries and the rest of the handshake after the first ClientHello are not compared."
varying_relationships = "The client random, session id, GREASE code values, key-share key bytes and ECH GREASE blob are drawn from the RNG and are checked by structure after normalization, not by byte value; check: each GREASE code lies in BoringSSL's 0x?a?a set, each key share's declared group and key length are kept, and normalization removes only the key bytes. Extension order is randomized by SSL_set_permute_extensions; check: the canonical extension multiset is compared after sorting by normalized type and body."
ordering = "Cipher suites in wire order; the canonical extension order is by normalized type and body after sorting"
oracle_defects = "none: no known oracle defects"
improvements = "none: no required oracle improvements"
anchor = "make tls-handshake-anchor captures the frozen browser's ClientHello through the shared HTTPS fixture's SOCKS5 TLS path and compares the modeled subset with the source harness and the candidate"
arm64_evidence = "captures: none produced; an arm64 Linux host must capture the frozen browser's ClientHello through the shared HTTPS fixture's SOCKS5 TLS path and compare the modeled subset with the source harness"
holdout_percent = 30
oracle = ".work/tmp/tls-handshake/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/tls-handshake"
fuzz = "driver"
fuzz_driver = "oracle/harness/tls-handshake/fuzz.py"
acceptance_cases = 20000
