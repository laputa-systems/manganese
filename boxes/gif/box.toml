seam = "Chromium 156 GIF decoding through blink::GIFImageDecoder over Skia's SkGifDecoder and SkWuffsCodec (Wuffs 0.3.0-alpha.4), driven as blink::SkiaImageDecoderBase drives SkCodec: decode_image_config for size over the SharedBuffer stream, then frame configs and frame buffers through startIncrementalDecode/incrementalDecode with SkFrameHolder alpha and required-frame selection, SkWuffsCodec's one-pass indexed-to-N32 swizzle, binary transparency and the enable of Wuffs' ignore-too-much-pixel-data quirk"
streaming = "MGB1 request op 0 carries a u32 chunk count and length-prefixed chunks of one GIF byte stream; chunk k is appended to the accumulated prefix and the whole prefix is decoded (all data received on the last); the response concatenates one record per chunk: size available, failed, width, height, frame count, repetition count, then per frame status, has alpha, duration ms, required frame, disposal, blend, frame rect, byte count and N32 BGRA pixels, with frames decoded in index order through blink's prior-frame selection"
reentrancy = "none: each chunk runs fresh header, frame-config and frame-buffer decoders synchronously; the prior-frame buffer is copied in index order as SkiaImageDecoderBase does"
callbacks = "none: Wuffs reads a seekable in-memory stream and paints into the supplied pixel buffer; no client callback is observed"
threading = "One thread per process; Chromium decodes GIFs on the calling thread"
wire_version = 1
corpus_sources = "Single-frame generated GIF87a and GIF89a files with 2 to 256 color global and local palettes, LZW code widths 2 to 9, sub-block sizes 1 to 255, sequential and interlaced rows, transparency, disposal methods 0 to 4, delays, frame offsets, partial frames, NETSCAPE2.0 loop counts and data-block truncations; palette-byte mutations; Skia's GIF resource images under 40000 bytes whose names do not contain anim or wheel, including invalid and empty images; the holdout uses other seeds and one third of the fixtures; fuzzing mutates seen lane requests and fresh single-frame generated GIFs. Multi-frame generated GIFs, multi-chunk streaming requests, full-byte mutations, animated fixtures and color-wheel fixtures are outside this box's corpus: they remain unverified against the frozen browser and are not claimed as covered. Animated-frame pixels, frame timing, screenshots, color management and arm64 are also outside the frozen-browser anchor."
environment = "x86_64 Linux musl; Skia's N32 is BGRA with binary alpha, so Wuffs' indexed-binary-alpha swizzle writes or skips whole BGRA pixels; skip over background color and image bounds quirks remain disabled, ignore-too-much-pixel-data is enabled; logical screen dimensions bound the pixel buffer, dimensions over 1000000 or buffers over 64 MiB fail; default base::Feature states and natural-size decoding only"
comparison = "exact"
observable_surface = "getImageData and drawImage pixels of decoded single GIF frames at natural size before color management, including binary transparency, partial frames of truncated GIFs and the transparent canvas of failed decodes; naturalWidth, naturalHeight and img.decode rejection on header failure (F16). Frame count, duration, disposal, blend and repetition count are source-harness observations only; the frozen-browser sidecar does not return them"
varying_relationships = "none: all recorded results are deterministic for the declared environment"
ordering = "Prefix order of chunks and frame index order"
oracle_defects = "none: no known oracle defects"
improvements = "none: no required oracle improvements"
anchor = "make gif-anchor compares first-frame pixels, natural size and img.decode failure for generated static GIFs in the frozen x86_64 browser through data: URLs and an sRGB canvas with the source harness; animated frames, frame timing, screenshots, color management and arm64 are excluded from the frozen-browser level"
arm64_evidence = "public_api: canvas getImageData in the frozen arm64 browser"
holdout_percent = 30
oracle = ".work/tmp/gif/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/gif"
fuzz = "driver"
