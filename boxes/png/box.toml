seam = "Chromium 156 PNG through Skia's Rust codec: SkPngRustDecoder (blink PngImageDecoder, gfx::PNGCodec decode) over the png 0.18.1 crate with rust_png_ffi's reader options, SkSwizzler, the Adam7 splat and APNG blending, driven the way blink's SkiaImageDecoderBase drives SkCodec; SkPngRustEncoder at kLow (canvas export, gfx::PNGCodec::FastEncodeBGRASkBitmap), kMedium (gfx::PNGCodec::EncodeBGRASkBitmap) and kHigh"
streaming = "MGB1 request op 0 carries a u32 chunk count and length-prefixed chunks of one PNG byte stream; chunk k models blink SetData with the first k chunks accumulated (all data received on the last), and the response concatenates one record per chunk: size available, failed, width, height, frame count, repetition count, then per frame status, has alpha, duration ms, required frame, disposal, blend, frame rect, byte count and N32 premultiplied BGRA pixels, with frames decoded in index order through startIncrementalDecode and incrementalDecode with blink's prior-frame selection; request op 1 carries u32 width, height and mode (operation times three plus alpha type) then N32 pixels, and the response is the encoded PNG or empty on failure"
reentrancy = "none: each request executes synchronously and decodes every prefix against a fresh codec"
callbacks = "none: the codec reads a seekable stream and calls no client callback"
threading = "One thread per process; the oracle decodes on the calling thread"
wire_version = 1
corpus_sources = "Generated images for every PNG color type and bit depth with each filter, with Adam7, with color chunks, with sBIT and tRNS and PLTE variants, with APNG frame rectangles, disposal, blend and sequences, split IDAT and fdAT chunks, truncations and byte mutations; the Skia resources PNG fixtures including the APNG test suite, pngsuite, invalid and empty images; seeded random N32 pixels for encode at premultiplied, opaque and unpremultiplied alpha; fuzz seeds mutate generated images and sample encode requests"
environment = "x86_64 Linux musl; Skia SkSwizzler and SkRasterPipeline integer paths, no FMA contraction; blink decode-time color transform disabled (null destination color space), so ICC, gAMA, cHRM, cICP and EXIF orientation do not affect output; frames over 64 MiB are not allocated"
comparison = "exact"
observable_surface = "canvas toDataURL and toBlob PNG bytes, DevTools Page.captureScreenshot PNG bytes, getImageData and drawImage pixels of decoded PNG and APNG, image size, frame count, durations and repetition count, and the failed or partial state of truncated and corrupt files"
varying_relationships = "none: all recorded results are deterministic for the declared environment"
ordering = "Prefix order of chunks and frame index order"
oracle_defects = "none: no known oracle defects"
improvements = "none: no required oracle improvements"
anchor = "make png-anchor compares color-neutral PNGs without iCCP gAMA cHRM sRGB or cICP using frozen x86_64 img decode and sRGB canvas readback against harness first-frame premultiplied BGRA with binary alpha, including palette tRNS grayscale 16-bit Adam7 APNG and truncated header and partial data; the partial decoder failure is distinct from the browser displaying its partial frame; toDataURL and toBlob kLow bytes cover opaque and binary-alpha putImageData; later animation frames, color-managed inputs, other alpha values, screenshots and arm64 are excluded"
arm64_evidence = "public_api: canvas toDataURL and getImageData in the frozen arm64 browser"
holdout_percent = 30
oracle = ".work/tmp/png/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/png"
fuzz = "driver"
fuzz_driver = "oracle/harness/png/fuzz.py"
acceptance_cases = 20000
