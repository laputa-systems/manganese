seam = "Chromium DevToolsHttpHandler on net HttpServer at --remote-debugging-port (contract 7.1 to 7.3): /json/version, /json and /json/list, PUT /json/new, /json/activate and /json/close, the Host header check, WebSocket upgrades on /devtools/browser and /devtools/page, and CDP message framing with browser-level dispatch errors"
streaming = "One request is one TCP connection script: version 1, u16 segment count, each a u32 length, its bytes and a u16 pause in milliseconds, then a u16 idle time that ends the read; pauses are capped at 500 ms and the idle time at 2000 ms, and a script that does not decode answers invalid script; the response is the canonical form of everything the endpoint sent and whether it closed the connection"
reentrancy = "none: each request replays one connection against an endpoint in its launch state"
callbacks = "none: the endpoint answers from the browser's target registry, which the box fixes to the launch state"
threading = "One endpoint and one client connection per request"
wire_version = 1
corpus_sources = "Hosts (IP, localhost, IPv6, names, empty, absent), methods, paths, HTTP versions, malformed and oversized requests, split and pipelined requests, every /json endpoint on launch targets and unknown ids, WebSocket handshakes with valid and invalid keys and versions, CDP text, binary, ping, close, fragmented, invalid JSON and 200 KB messages on the browser and page sockets, permessage-deflate upgrades with compressed sequential and fragmented Browser.getVersion exchanges, negotiated context reset, and a compressed frame without a negotiated extension"
environment = "x86_64 Linux musl; the frozen x86_64 archive headless under the launch harness, as launched: targets about:blank and two omnibox popups"
comparison = "exact"
observable_surface = "Per response: HTTP version, status code, headers in order with lowercase names and trimmed values, body; WebSocket frames after a 101; whether the endpoint closed the connection"
varying_relationships = "present: the browser UUID and target ids are random per launch. check: the oracle daemon rewrites the browser id to 00000000-0000-4000-8000-000000000001 and the launch targets to 00000000000000000000000000000001 to ...03 in list order, ids it creates to F0000000000000000000000000000001 onward, and fixed ids in a request back to the live ones; every substitution keeps its length. Also: the frozen browser closes a WebSocket upgrade sent in segments before writing its handshake in about 1 of 300 replays (ws-browser-get-version answered `closed yes` on replay 296 with readiness complete and no queued response); the runner asks a varying oracle again and accepts only an answer the oracle itself gave, and the candidate always completes the handshake"
ordering = "Responses, headers and frames keep the order the endpoint sent them"
oracle_defects = "present: GET /json/protocol and /json/protocol/<anything> kill the browser on the first request, so they are outside the corpus. assert: the candidate answers 100 consecutive GET /json/protocol requests with the protocol JSON and keeps serving (contract 7.3)"
improvements = "present: contract 7.3 requires surviving repeated /json/protocol requests. assert: the candidate's /json/protocol test passes"
anchor = "none: the oracle is the frozen browser itself, driven through oracle/harness/devtools-endpoint/daemon.py, so every golden is a frozen-browser observation"
arm64_evidence = "captures: the frozen arm64 CDP trace (oracle/frozen/cdp/) exercises the same endpoint"
holdout_percent = 30
oracle = ".work/tmp/target/x86_64-unknown-linux-musl/debug/devtools-endpoint-oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/devtools-endpoint"
fuzz = "corpus"
fuzz_max_len = 65536
fuzz_seeds = "version-host-ip-port list-host-localhost path-1 method-new-put ws-browser-get-version ws-browser-fragmented pipelined-two split-two malformed-0"
acceptance_cases = 20000
