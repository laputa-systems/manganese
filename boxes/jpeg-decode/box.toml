seam = "Chromium 156 blink::JPEGImageDecoder over its libjpeg-turbo 3.1.0 build, driven as Blink drives it for img, CSS and canvas images: DeferredImageDecoder's metadata decoder over the SharedBuffer for size, EXIF orientation, density and the ICC segments SkJpegMetadataDecoder joins, and ImageDecoderWrapper's frame decoder over the ParkableImage RWBuffer snapshot (SetData, FrameCount once all data arrived, DecodeFrameBufferAtIndex(0), SetData(nullptr)) at the natural size, including libjpeg's suspending source manager, buffered-image progressive output with block smoothing, the corrupt-warning stop and the 100-scan limit"
streaming = "MGB1 request op 0 carries a u32 chunk count and length-prefixed chunks of one JPEG byte stream; chunk k is appended to the SharedBuffer as network data and both decoders get SetData with the first k chunks (all data received on the last); the response concatenates one record per chunk: sniff phase (0 too short to sniff, 1 no JPEG signature, 2 JPEG), the header decoder's size-available and failed flags, natural size, EXIF orientation, density-corrected size and ICC profile bytes or none, then whether the frame decoder exists, its failed flag, frame status, has-alpha, frame size and N32 premultiplied BGRA frame bytes"
reentrancy = "none: each request runs one header decoder and one frame decoder synchronously; the frame decoder resumes across chunks as ImageDecodingStore resumes a cached decoder"
callbacks = "libjpeg's source manager callbacks (Blink's fill_input_buffer, skip_input_data and restart-position bookkeeping, term_source completing the frame) and its progress monitor are modeled inside the seam; no client callback is observed"
threading = "One thread per process; Blink decodes on the calling thread"
wire_version = 1
corpus_sources = "JPEGs generated by the oracle tree's libjpeg-turbo compressor: YCbCr, grayscale, RGB, CMYK and YCCK baseline, extended, simple and custom progressive scripts, multi-scan sequential, restart intervals, optimized and default Huffman tables, sampling factors 1 to 4 per component including chroma larger than luma, fractional and invalid factors, lossless predictors 1 to 7 with point transforms and precisions 2 to 16, 12-bit lossy, arithmetic and unsupported SOF types, Adobe and JFIF variants, 2 and 5 components, DNL, DRI and DQT between scans, restart marker loss and misorder, garbage, duplicate and reserved markers, tables-only and truncated headers, oversized dimensions, EXIF orientations 0 to 9 with density, sub-IFD and malformed directories, single and multi-segment ICC with malformed sequences, byte-by-byte and RWBuffer-block-straddling chunkings, truncations and byte mutations; oracle-tree fixtures (libjpeg-turbo testimages, Blink image-decoder, platform and core test data, Skia resources with the EXIF orientation set, Go image testdata, TFLite, libyuv, crabbyavif and content test data) whole, chunked, truncated and mutated; the holdout uses other seeds and every third fixture; fuzzing mutates seen inputs and fresh compressor output"
environment = "x86_64 Linux musl with AVX2: libjpeg-turbo's AVX2 accurate integer IDCT (16-bit dequantization, wrapping 16-bit sums and saturating packs) and its SIMD fancy upsampling and YCbCr conversion, which equal its C paths on in-range data; Chromium's jconfigint.h derives SIZEOF_SIZE_T from __WORDSIZE, which musl leaves undefined, so the Huffman decoders use the 32-bit bit buffer; default base::Feature states (RustyJpeg off); the frame decoder uses ColorBehavior::kIgnore, so an ICC profile never transforms pixels and is reported as the bytes color management receives; frames over 64 MiB fail allocation; natural-size decoding only"
comparison = "exact"
observable_surface = "getImageData and drawImage pixels of decoded JPEGs at natural size before color management, which is what a canvas reads for JPEGs without an embedded ICC profile, including the partial frames of truncated and streaming JPEGs and the transparent canvas of decodes that fail before output; naturalWidth and naturalHeight with EXIF orientation and density correction; img.decode rejection on header failures; the ICC profile bytes handed to color management (F16)"
varying_relationships = "none: all recorded results are deterministic for the declared environment"
ordering = "Chunk order, one header record and one frame record per chunk"
oracle_defects = "none: no known oracle defects"
improvements = "none: no required oracle improvements"
anchor = "make jpeg-decode-anchor decodes corpus JPEGs as data: URLs in the frozen x86_64 browser and compares img.decode failure, naturalWidth and naturalHeight and the getImageData pixels of an sRGB canvas drawn at natural size with the harness: libjpeg-turbo baseline, progressive, grayscale and 4:2:2 test images, 4:4:4, 4:2:2, 4:4:0, 4:2:0, 4:1:1, 4:1:0, 3:1, 1:4 and chroma-larger sampling, progressive with restarts, CMYK, YCCK, lossless, EXIF orientations 1 to 8 (harness pixels rotated), a truncated header, truncated baseline and progressive partial frames, and arithmetic and 12-bit failures (transparent canvas); ICC-tagged images are compared on size only; streaming chunk boundaries, color management, screenshots and arm64 are excluded"
arm64_evidence = "public_api: canvas getImageData in the frozen arm64 browser"
holdout_percent = 30
oracle = ".work/tmp/jpeg-decode/oracle"
candidate = ".work/tmp/target/x86_64-unknown-linux-musl/debug/jpeg-decode"
fuzz = "driver"
fuzz_driver = "oracle/harness/jpeg-decode/fuzz.py"
acceptance_cases = 20000
