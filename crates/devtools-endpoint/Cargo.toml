[package]
name = "devtools-endpoint"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "devtools-endpoint-oracle"
path = "src/bin/oracle.rs"

[[bin]]
name = "devtools-endpoint"
path = "src/bin/candidate.rs"

[dependencies]
smol = { package = "laputa-smol", path = "../../vendor/smolith/crates/smol" }
fastwebsockets = { package = "laputa-fastwebsockets-futures-lite", path = "../../vendor/smolith/crates/laputa-fastwebsockets-futures-lite" }
sha1 = "0.11"
base64 = "0.23"
getrandom = { version = "0.4", features = ["std"] }
