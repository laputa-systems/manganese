[package]
name = "cert-verify"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
webpki = { package = "rustls-webpki", git = "https://github.com/laputa-systems/webpki", rev = "26ac739bdd7966ff81a02ac48a21b737d3edc97e", default-features = false }
pki-types = { package = "rustls-pki-types", version = "1.13", default-features = false }
graviola = "=0.4.5"
rsa = { version = "=0.9.10", default-features = false, features = ["std", "u64_digit"] }
sha2 = { version = "0.10.9", features = ["oid"] }
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic"] }
p384 = { version = "0.13.0", default-features = false, features = ["arithmetic"] }
p521 = { version = "0.13.3", default-features = false, features = ["arithmetic", "ecdsa"] }
idna = "=1.1.0"
